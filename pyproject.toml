[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metr-la-traffic-speed-baseline"
version = "1.0.0"
description = "Historical METR-LA traffic speed prediction at 15, 30, and 60 minutes using classical machine learning and causal windowing"
readme = "README.md"
authors = [
    { name = "Member 1 (Data & Provenance)" },
    { name = "Member 2 (Features & Baselines)" },
    { name = "Member 3 (Models & Evaluation)" },
    { name = "Member 4 (App & Integration)" }
]
requires-python = ">=3.9"
dependencies = [
    "h5py>=3.10.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "streamlit>=1.30.0",
    "pytest>=8.0.0",
    "python-pptx>=1.0.0",
    "requests>=2.31.0",
    "pyarrow>=15.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
